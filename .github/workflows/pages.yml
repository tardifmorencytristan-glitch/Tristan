name: Deploy Pages

# GitHub Pages is not enabled on this repository. actions/configure-pages
# enablement uses the Actions GITHUB_TOKEN to POST /repos/{owner}/{repo}/pages.
# That token cannot create a site: the call returns 403
# "Resource not accessible by integration" (it needs a GitHub App token with
# administration:write and pages:write, not GITHUB_TOKEN). enablement is
# therefore left at its default (false). See run 37494444327.
#
# One-time setup (repository admin, cannot be done from Actions):
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# Then Actions → Deploy Pages → Run workflow.
# Until GET /pages returns a site with build_type=workflow, this workflow
# succeeds without deploying so it does not fail default-branch health.
#
# The public surface is the root HTML pages (index.html and the pages it
# links), not docs/ and not the kernel. Periodic reports/ commits do not
# schedule this workflow.

on:
  push:
    branches: [main, cursor/fix-pages-deploy-7a22]
    paths:
      - ".github/workflows/pages.yml"
      - "index.html"
      - "quickcheck.html"
      - "quickcheck-after-purchase.html"
      - "after-purchase.html"
      - "QUICKCHECK_TERMS.md"
      - "examples/REPO_QUICKCHECK_SAMPLE.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check whether GitHub Pages accepts a workflow deploy
        id: pages_site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /tmp/pages-site.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/pages")
          echo "GET /repos/${GITHUB_REPOSITORY}/pages -> ${http_code}"
          if [ "${http_code}" = "200" ]; then
            build_type=$(python3 -c 'import json; print(json.load(open("/tmp/pages-site.json")).get("build_type") or "")')
            echo "build_type=${build_type}"
            if [ "${build_type}" = "workflow" ]; then
              echo "enabled=true" >> "${GITHUB_OUTPUT}"
            else
              echo "enabled=false" >> "${GITHUB_OUTPUT}"
              echo "::notice title=Pages source is not GitHub Actions::Site build_type is '${build_type}'. Settings → Pages → Build and deployment → Source: GitHub Actions. Then re-run Deploy Pages."
            fi
          elif [ "${http_code}" = "404" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=GitHub Pages is not enabled::Settings → Pages → Build and deployment → Source: GitHub Actions. Actions cannot create the site (POST /pages returns 403 Resource not accessible by integration). This job succeeds without deploying. After Pages is enabled, re-run Deploy Pages to publish."
          else
            echo "::error title=Pages API unexpected status::GET /pages returned ${http_code}"
            python3 -c 'print(open("/tmp/pages-site.json").read()[:2000])'
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.pages_site.outputs.enabled == 'true'

      - uses: actions/configure-pages@v5
        if: steps.pages_site.outputs.enabled == 'true'

      - name: Stage public site
        if: steps.pages_site.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p _site/examples
          cp -- index.html quickcheck.html quickcheck-after-purchase.html after-purchase.html QUICKCHECK_TERMS.md _site/
          cp -- examples/REPO_QUICKCHECK_SAMPLE.md _site/examples/
          find _site -type f -print | sort
          test -s _site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_site.outputs.enabled == 'true'
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages_site.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
