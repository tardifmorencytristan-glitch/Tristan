name: jarvis-r6-evidence-domino

on:
  pull_request:
    paths:
      - 'src/tristan/**'
      - 'tests/test_jarvis_unified_runtime_r5.py'
      - 'tests/test_jarvis_r6_evidence_domino.py'
      - 'docs/JARVIS_R6_EVIDENCE_DOMINO.md'
      - '.github/workflows/jarvis-r6-evidence-domino.yml'
  push:
    branches: [main]
    paths:
      - 'src/tristan/**'
      - 'tests/test_jarvis_unified_runtime_r5.py'
      - 'tests/test_jarvis_r6_evidence_domino.py'
      - 'docs/JARVIS_R6_EVIDENCE_DOMINO.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_jarvis*.py'
      - run: tristan verify
