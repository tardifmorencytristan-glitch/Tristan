name: Omega Scientific Writing R0

on:
  push:
    paths:
      - 'omega_scientific_writing/**'
      - '.github/workflows/omega-scientific-writing-r0.yml'
  pull_request:
    paths:
      - 'omega_scientific_writing/**'
      - '.github/workflows/omega-scientific-writing-r0.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s omega_scientific_writing/tests -v
      - name: Positive fixture lint
        run: python omega_scientific_writing/src/scientific_lint.py omega_scientific_writing/examples/minimal_valid.json
      - name: Negative fixture must fail
        shell: bash
        run: |
          set +e
          python omega_scientific_writing/src/scientific_lint.py omega_scientific_writing/examples/minimal_invalid.json
          status=$?
          set -e
          test "$status" -eq 1
