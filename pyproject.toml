[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tristan-kernel"
version = "0.1.0"
description = "Minimum public regenerable kernel for the Tristan ecosystem"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/tardifmorencytristan-glitch/Tristan"
Services = "https://tristan-tardif-morency-tfug.vercel.app/services"
Support = "https://github.com/tardifmorencytristan-glitch/Tristan/blob/main/SUPPORT.md"
"TRISTAN Pro" = "https://github.com/tardifmorencytristan-glitch/Tristan/blob/main/PRO.md"

[project.scripts]
tristan = "tristan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
